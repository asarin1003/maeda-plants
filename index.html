<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前田さんの植物写真帖</title><meta name="description" content="前田幸男さんのX投稿から植物写真を集めた非公式コレクション">
<style>
:root{--bg:#f5f4ef;--ink:#233027;--sub:#6d756e;--line:#dcded8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{padding:56px 22px 32px;text-align:center}h1{margin:0;font-family:"Yu Mincho",serif;font-size:clamp(30px,5vw,50px);font-weight:500;letter-spacing:.08em}
header p{color:var(--sub);font-size:13px}.bar{max-width:1240px;margin:auto;padding:10px 18px 18px;display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.grid{max-width:1240px;margin:auto;padding:0 14px 60px;columns:4 250px;column-gap:12px}.card{break-inside:avoid;margin:0 0 12px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.card img{width:100%;height:auto;display:block}.meta{padding:10px 11px 12px}.text{font-size:13px;line-height:1.65;white-space:pre-wrap}.date{margin-top:8px;color:var(--sub);font-size:11px}
a{color:inherit;text-decoration:none}.empty{text-align:center;padding:80px 20px;color:var(--sub)}footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--sub);font-size:11px}
@media(max-width:600px){header{padding-top:38px}.grid{columns:2 150px;padding-left:8px;padding-right:8px;column-gap:8px}.card{margin-bottom:8px;border-radius:8px}.meta{padding:8px}.text{font-size:12px}}
</style></head><body>
<header><h1>前田さんの植物写真帖</h1><p>Yukio Maeda — Botanical photographs from X</p></header>
<div class="bar"><span id="count"></span><a href="https://x.com/yukio_maeda" target="_blank" rel="noopener">X @yukio_maeda ↗</a></div>
<main id="grid" class="grid"></main>
<footer>写真・文章 © Yukio Maeda / 元投稿へのリンクを付した非公式コレクション</footer>
<script>
(async()=>{const el=document.getElementById("grid");try{const posts=await fetch("./data/posts.json?"+Date.now()).then(r=>r.json());
const items=posts.flatMap(p=>(p.photos||[]).map((photo,i)=>({p,photo,i})));
document.getElementById("count").textContent=items.length+" photos / "+posts.length+" posts";
if(!items.length){el.innerHTML='<div class="empty">写真を収集中です。</div>';return}
el.innerHTML=items.map(({p,photo})=>'<article class="card"><a href="'+p.url+'" target="_blank" rel="noopener"><img loading="lazy" src="'+photo+'" alt=""></a><div class="meta"><div class="text">'+esc(p.text||"")+'</div><div class="date">'+fmt(p.created_at)+' · Xで元投稿を見る ↗</div></div></article>').join("");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(s){if(!s)return"";try{return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric"}).format(new Date(s))}catch{return s}}
}catch(e){el.innerHTML='<div class="empty">データを読み込めませんでした。</div>'}})();
</script></body></html>
