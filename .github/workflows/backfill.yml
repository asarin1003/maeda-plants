name: Backfill older botanical posts
on:
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * 0"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover older public post IDs
        run: python scripts/backfill.py
      - name: Enrich and filter discovered posts
        run: python scripts/update.py
      - name: Commit discoveries
        run: |
          git config user.name "maeda-plants-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json data/backfill-state.json
          git diff --cached --quiet || git commit -m "Backfill older botanical posts"
          git push
